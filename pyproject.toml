[project]
name = "kgteach"
version = "0.1.0"
description = "Agent-first KataGo teaching adapter"
readme = "README.md"
authors = [
    { name = "kgteach contributors" }
]
requires-python = ">=3.11"
license = "MIT"
keywords = ["go", "baduk", "weiqi", "katago", "teaching", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KaiQin04/kgteach"
Repository = "https://github.com/KaiQin04/kgteach"
Issues = "https://github.com/KaiQin04/kgteach/issues"

[project.scripts]
kgteach = "kgteach.cli:main"
kg = "kgteach.cli:main"
kgteach-mcp = "kgteach.mcp_server:main"

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==9.0.1",
    "ruff==0.14.6",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
